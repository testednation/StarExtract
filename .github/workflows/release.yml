name: Release

# Builds the .NET variant, the native C++ variant, and attaches them to the
# GitHub Release for a version tag push (v1.2.3). Manually dispatchable too.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Shared snippet: Inno Setup installers moved to GitHub releases; download the
# portable exe, install silently, and put ISCC.exe on PATH.
# (Inlined in each job since YAML has no cross-job include for steps.)

jobs:
  build:
    name: Build ${{ matrix.arch }} installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"

      - name: Resolve full version (tag + build number)
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($tag -match '^\d+\.\d+\.\d+\.\d+$') {
            $full = $tag
          } else {
            $full = "$tag.${{ github.run_number }}"
          }
          "full=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Full version: $full"

      - name: Stage payloads
        shell: pwsh
        run: |
          tools\stage-payload.ps1 `
            -Arch ${{ matrix.arch }} `
            -RepoRoot ${{ github.workspace }} `
            -PayloadRoot "$env:RUNNER_TEMP\installer" `
            -FullVersion "${{ steps.ver.outputs.full }}"

      - name: Compile installer
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $full = "${{ steps.ver.outputs.full }}"
          & ISCC.exe installer\StarExtract-installer.iss `
            "/DArch=$arch" `
            "/DRepoRoot=${{ github.workspace }}" `
            "/DPayloadRoot=$env:RUNNER_TEMP\installer" `
            "/DAppVersion=$full"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create portable + setup ZIPs (names carry the full version)
        # NOTE: 7z.exe (not Compress-Archive) — the plugin tree contains
        # pre-1980 timestamps that break Compress-Archive on PS 5.1.
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $full = "${{ steps.ver.outputs.full }}"
          $payload = "$env:RUNNER_TEMP\installer\payload-$arch"
          $stage = "$env:RUNNER_TEMP\installer\portable-$arch"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$payload\*" $stage -Recurse -Force
          Copy-Item "${{ github.workspace }}\bin" "$stage\bin" -Recurse -Force
          Copy-Item "${{ github.workspace }}\README.md" "$stage\README.md" -Force
          & "${{ github.workspace }}\7z.exe" a -tzip "$env:RUNNER_TEMP\installer\output\StarExtract-$full-portable-$arch.zip" "$stage\*" -mx=9
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "${{ github.workspace }}\7z.exe" a -tzip "$env:RUNNER_TEMP\installer\output\StarExtract-$full-setup-$arch.zip" "$env:RUNNER_TEMP\installer\output\StarExtract-$full-setup-$arch.exe" -mx=9
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarExtract-setup-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/installer/output/StarExtract-*-setup-${{ matrix.arch }}.exe
            ${{ runner.temp }}/installer/output/StarExtract-*-portable-${{ matrix.arch }}.zip
            ${{ runner.temp }}/installer/output/StarExtract-*-setup-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-native:
    name: Build native installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"

      - name: Resolve full version (tag + build number)
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($tag -match '^\d+\.\d+\.\d+\.\d+$') {
            $full = $tag
          } else {
            $full = "$tag.${{ github.run_number }}"
          }
          "full=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Full version: $full"

      - name: Build native edition + installers + ZIPs (x64 + x86)
        # build-installers.ps1 -NativeOnly builds the C++ edition for both
        # arches, stages payload-nat-*, compiles the -native installers, and
        # makes the portable/setup ZIPs. -Version stamps the CI full version;
        # -NoIncrement keeps the build-number bump out of CI.
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File build-installers.ps1 -NativeOnly `
            -Version "${{ steps.ver.outputs.full }}" -NoIncrement
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect native artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\installer\output\collect" -Force | Out-Null
          Get-ChildItem "C:\temp\installer\output" -Filter "*-native-*" -File |
            Copy-Item -Destination "$env:RUNNER_TEMP\installer\output\collect"

      - name: Upload native installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarExtract-setup-native
          path: ${{ runner.temp }}/installer/output/collect
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    needs: [build, build-native]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to release
        # delete_assets: re-pointing a tag (or a re-run) must not mix stale
        # asset versions from an earlier build into the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*.exe
            installers/*.zip
          generate_release_notes: true
          delete_assets: "all"
